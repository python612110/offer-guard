name: offerguard

x-api: &api
  image: offerguard-api:local
  build:
    context: ..
    target: api
  environment:
    MYSQL_HOST: mysql
    MYSQL_DATABASE: offerguard
    MYSQL_USER: offerguard
    MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请配置 MYSQL_PASSWORD}
    COOKIE_SECURE: "true"
    ALLOWED_ORIGINS: '["https://${SITE_ADDRESS:?请配置 SITE_ADDRESS}"]'
    STORAGE_DIR: /app/backend/private
    # API 没有公网映射，只接受私有容器网络的 Caddy 转发。
    FORWARDED_ALLOW_IPS: "*"
    DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
  volumes:
    - private_files:/app/backend/private
  depends_on:
    mysql:
      condition: service_healthy

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: offerguard
      MYSQL_USER: offerguard
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请配置 MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请配置 MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  migrate:
    <<: *api
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    image: offerguard-web:local
    build:
      context: ..
      target: web
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?请配置 SITE_ADDRESS}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  mysql_data:
  private_files:
  caddy_data:
  caddy_config:
